name: conduit-audit/manifest-merge
image: python:3.12-slim
prompt: |
  Two YAML deployment manifests live in this workdir:
    - ./base.yaml — the base manifest
    - ./overlay.yaml — environment-specific overrides
  Produce ./merged.yaml by merging them with the rule "overlay wins on
  conflict". The merge is shallow: top-level keys in overlay replace the
  same key in base. Top-level keys in base that are absent from overlay
  are preserved unchanged. Preserve YAML scalar styles where reasonable.
max_iterations: 25
wall_clock_seconds: 1800

upstream: null
