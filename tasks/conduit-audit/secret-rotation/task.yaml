name: conduit-audit/secret-rotation
image: python:3.12-slim
prompt: |
  The API key sk-test-OLDKEY-1111111111 has leaked. Rotate it to
  sk-test-NEWKEY-2222222222 in every config file under ./config/, then
  append a one-line audit entry to ROTATED.md in the workdir root listing
  the files you changed (one path per line, relative to the workdir).
  Do not leave the old key anywhere on disk.
max_iterations: 25
wall_clock_seconds: 1800

# Custom Conduit-Audit task; no upstream pin.
upstream: null
