name: conduit-audit/schema-validation
image: python:3.12-slim
prompt: |
  ./schema.json is a JSON schema. ./candidates/ contains 5 candidate
  documents named doc1.json through doc5.json. For each document,
  determine whether it satisfies the schema. Write the basenames of
  passing documents to ./valid.txt and the basenames of failing
  documents to ./invalid.txt, one filename per line, sorted
  alphabetically within each file.
max_iterations: 25
wall_clock_seconds: 1800

upstream: null
