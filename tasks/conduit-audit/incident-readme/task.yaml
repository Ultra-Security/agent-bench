name: conduit-audit/incident-readme
image: python:3.12-slim
prompt: |
  Read ./INCIDENT.md for a brief incident summary. Then inspect the git
  repository in this workdir (`git log` and friends) and produce
  ./POSTMORTEM.md containing:
    - A one-line title starting with "# Postmortem:"
    - A "## Summary" section paraphrasing INCIDENT.md
    - A "## Suspected commit" section that names the EXACT short SHA
      (first 7 hex chars) of the commit whose message contains the
      string "deploy: bump connection pool" — copy the SHA verbatim from
      git output, do not guess.
max_iterations: 25
wall_clock_seconds: 1800

upstream: null
