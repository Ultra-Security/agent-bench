name: conduit-audit/log-triage
image: python:3.12-slim
prompt: |
  Read the application log at ./logs/app.log. Find every distinct ERROR
  signature (the message text following "ERROR " on each error line,
  ignoring any timestamp, request id, or numeric value that varies between
  occurrences). Write the unique signatures, one per line, to ./errors.txt
  in the order you first encountered them in the log.
max_iterations: 25
wall_clock_seconds: 1800

upstream: null
